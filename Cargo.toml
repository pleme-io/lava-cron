[package]
authors = ["pleme-io"]
description = "lava-cron — typed (deflava-cron …) for scheduled lava deployments. Each schedule pairs a cron expression with a LavaArchitecture reference + bindings; the typed CronSchedule + Tick state machine drives next-fire calculation. Pangea-cron analog."
edition = "2024"
license = "MIT"
name = "lava-cron"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-cron"
version = "0.1.4"

[lib]
name = "lava_cron"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
lava-eval = "0.1"
